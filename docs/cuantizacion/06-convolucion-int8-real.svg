<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">Convolución int8 con pesos reales</title>
<desc id="d">Un parche 3x3 de entrada int8 se multiplica por el filtro real de la primera capa; el acumulador int32 suma canales y bias, da 13191, se desplaza 9 bits a 26 y se aplica ReLU.</desc>
