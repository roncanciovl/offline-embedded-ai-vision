<text x="290" y="120" class="small bold">pesos int8 reales · canal R · e = −7</text>
<text x="290" y="138" class="small muted">w = q · 2⁻⁷ (p. ej. 76 → 0.594)</text>
<text x="540" y="120" class="small bold">productos int8 × int8</text>
<text x="540" y="138" class="small muted">se suman en un int32</text>
