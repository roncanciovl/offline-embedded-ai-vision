<text class="sub" x="30" y="66">Capa model.0.conv, filtro 0. Pesos, bias y exponentes leídos del .espdl; el parche de píxeles es un ejemplo (gris, R = G = B).</text>
<text x="40" y="120" class="small bold">entrada int8 · canal R · e = −7</text>
