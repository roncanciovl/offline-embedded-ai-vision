<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">Calibración del rango de cuantización</title>
<desc id="d">Un histograma real de pesos del modelo con una ventana de cuantización que alterna entre demasiado estrecha (satura el 10 por ciento), demasiado ancha (pierde resolución) y la elegida.</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;
--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--red:#cf222e;--red-bg:#ffebe9;
--orange:#bc4c00;--orange-bg:#fff1e5;--purple:#8250df;--purple-bg:#fbefff;--grid:#d8dee4;--yellow-bg:#fff8c5}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;
--muted:#9198a1;--blue:#4493f8;--blue-bg:#0c2d6b;--green:#3fb950;--green-bg:#0f3a1d;--red:#f85149;
--red-bg:#4b1113;--orange:#db6d28;--orange-bg:#3d1f00;--purple:#ab7df8;--purple-bg:#2e1a52;--grid:#30363d;--yellow-bg:#3b2e00}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.muted{fill:var(--muted)}
.title{font-size:22px;font-weight:600}
.sub{font-size:14px;fill:var(--muted)}
.small{font-size:12px}
.bold{font-weight:600}
.card{fill:var(--bg);stroke:var(--border);stroke-width:1}
.panel{fill:var(--panel);stroke:var(--border);stroke-width:1}
.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-red{fill:var(--red)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}
.s-blue{stroke:var(--blue)}.s-green{stroke:var(--green)}.s-red{stroke:var(--red)}.s-orange{stroke:var(--orange)}.s-purple{stroke:var(--purple)}
.b-blue{fill:var(--blue-bg)}.b-green{fill:var(--green-bg)}.b-red{fill:var(--red-bg)}.b-orange{fill:var(--orange-bg)}.b-purple{fill:var(--purple-bg)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}
.gridline{stroke:var(--grid);stroke-width:1}

.bar{fill:var(--blue);opacity:.75}
.win{transform-origin:480px 0;animation:win 15s cubic-bezier(.6,0,.3,1) infinite}
@keyframes win{0%,30%{transform:scaleX(.5)}35%,63%{transform:scaleX(2)}68%,97%{transform:scaleX(1)}100%{transform:scaleX(.5)}}
.wr{fill:var(--green);fill-opacity:.08;stroke:var(--green);stroke-width:2.5}
.lv{stroke:var(--green);stroke-width:1;opacity:.55}
.tail{fill:var(--red);opacity:0;animation:tail 15s linear infinite}
@keyframes tail{0%{opacity:0}4%,28%{opacity:.85}32%,100%{opacity:0}}
.st{font-size:15px;font-weight:600}
@keyframes sA{0%{opacity:0}1.667%{opacity:1}31.667%{opacity:1}33.333%{opacity:0}100%{opacity:0}}.sA{animation:sA 15s linear infinite}@keyframes sB{0%{opacity:0}33.333%{opacity:0}35.000%{opacity:1}65.000%{opacity:1}66.667%{opacity:0}100%{opacity:0}}.sB{animation:sB 15s linear infinite}@keyframes sC{0%{opacity:0}66.667%{opacity:0}68.333%{opacity:1}98.333%{opacity:1}100%{opacity:1}}.sC{animation:sC 15s linear infinite;opacity:1}@media (prefers-reduced-motion: reduce){.win{transform:none}.sA,.sB{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="card" x="0.5" y="0.5" width="959" height="519" rx="12"/>
<text class="title" x="30" y="42">Calibración: elegir e es elegir entre rango y resolución</text>
<text class="sub" x="30" y="66">Los 256 niveles int8 se reparten en [−128·2^e, 127·2^e]. Como Δ = 2^e, cambiar e en 1 duplica o divide a la mitad el rango.</text>
<text class="small muted" x="30" y="88">Barras: forma real de los 348 852 pesos int8 del modelo del proyecto (todas las capas).</text>
<line x1="60" y1="352" x2="900" y2="352" stroke="var(--fg)" stroke-width="1.5"/>
