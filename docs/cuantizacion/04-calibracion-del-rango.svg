<text x="900" y="380" text-anchor="end" class="small muted">marcas verdes: cada una = 16 de los 256 niveles</text>
<g class="sA"><rect x="60" y="396" width="840" height="78" rx="8" fill="var(--red-bg)"/><text x="80" y="424" class="st f-red">e − 1 → rango ×½: demasiado estrecho</text><text x="80" y="446" class="small">Paso más fino, pero todo lo que queda fuera se recorta a −128 o 127.</text><text x="80" y="464" class="small">Con los pesos reales del modelo: ≈ 10 % (|q| ≥ 64) quedaría saturado → errores grandes.</text></g>
<g class="sB"><rect x="60" y="396" width="840" height="78" rx="8" fill="var(--orange-bg)"/><text x="80" y="424" class="st f-orange">e + 1 → rango ×2: demasiado ancho</text><text x="80" y="446" class="small">No se recorta nada, pero el paso Δ es el doble: los datos usan solo la mitad de los 256 niveles.</text><text x="80" y="464" class="small">El error de redondeo de cada valor se duplica (se pierde 1 bit de resolución).</text></g>
<g class="sC"><rect x="60" y="396" width="840" height="78" rx="8" fill="var(--green-bg)"/><text x="80" y="424" class="st f-green">e elegido por ESP-PPQ: el rango justo</text><text x="80" y="446" class="small">Los valores llenan los 256 niveles y casi nada se recorta (solo el 0.01 % de los pesos toca −128 o 127).</text><text x="80" y="464" class="small">Para activaciones, e se calibra pasando imágenes reales: aquí conviene usar fotogramas del dataset del carro.</text></g>
</svg>
