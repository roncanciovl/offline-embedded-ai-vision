<rect class="box" x="25" y="92" width="205" height="100" rx="10"/>
<rect class="hl" x="22" y="89" width="211" height="106" rx="12" style="animation-delay:-14.0s"/>
<circle cx="45" cy="114" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="45" y="118.5" text-anchor="middle" class="small bold">1</text>
<text x="63" y="119" class="bold" style="font-size:15px">Videos MP4</text>
<text x="39" y="144" class="small">Delivery1…6.mp4</text>
<text x="39" y="162" class="small muted">cámara del carro</text>
<rect x="39" y="168" width="43.0" height="17" rx="8.5" fill="var(--panel)" stroke="var(--muted)" stroke-width=".8"/>
<text x="60.5" y="180" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--muted)">datos</text>
<rect class="box" x="260" y="92" width="205" height="100" rx="10"/>
<rect class="hl" x="257" y="89" width="211" height="106" rx="12" style="animation-delay:-12.25s"/>
<circle cx="280" cy="114" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="280" y="118.5" text-anchor="middle" class="small bold">2</text>
<text x="298" y="119" class="bold" style="font-size:15px">vid2frames.m</text>
<text x="274" y="144" class="small">fotogramas → 224×224</text>
<text x="274" y="162" class="small muted">MATLAB, bilineal</text>
<rect x="274" y="168" width="43.0" height="17" rx="8.5" fill="var(--panel)" stroke="var(--muted)" stroke-width=".8"/>
<text x="295.5" y="180" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--muted)">uint8</text>
