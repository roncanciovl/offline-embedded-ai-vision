<text x="527.0" y="354" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--green)">int8</text>
<rect class="box" x="260" y="266" width="205" height="100" rx="10"/>
<rect class="hl" x="257" y="263" width="211" height="106" rx="12" style="animation-delay:-3.5s"/>
<circle cx="280" cy="288" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="280" y="292.5" text-anchor="middle" class="small bold">7</text>
<text x="298" y="293" class="bold" style="font-size:15px">ESP32-P4</text>
<text x="274" y="318" class="small">JPEG → RGB888 → int8</text>
<text x="274" y="336" class="small muted">128 nodos, 101 Conv</text>
<rect x="274" y="342" width="36.0" height="17" rx="8.5" fill="var(--green-bg)" stroke="var(--green)" stroke-width=".8"/>
<text x="292.0" y="354" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--green)">int8</text>
<rect class="box" x="25" y="266" width="205" height="100" rx="10"/>
<rect class="hl" x="22" y="263" width="211" height="106" rx="12" style="animation-delay:-1.75s"/>
<circle cx="45" cy="288" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="45" y="292.5" text-anchor="middle" class="small bold">8</text>
<text x="63" y="293" class="bold" style="font-size:15px">pc_viewer.py</text>
<text x="39" y="318" class="small">JSON por USB serie</text>
<text x="39" y="336" class="small muted">cajas con OpenCV</text>
<rect x="39" y="342" width="57.0" height="17" rx="8.5" fill="var(--panel)" stroke="var(--muted)" stroke-width=".8"/>
<text x="67.5" y="354" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--muted)">píxeles</text>
<g class="conv"><rect x="580" y="234" width="142" height="24" rx="6" fill="var(--purple)"/><text x="651" y="250.5" text-anchor="middle" class="mono" style="font-size:12px;fill:#fff">round(w · 2⁷) = 76</text></g>
<g class="chip"><rect class="chipbox" x="-66" y="-12" width="132" height="24" rx="12"/><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-14.0s">vídeo</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-12.25s">224×224 px</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-10.5s">+ etiquetas</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-8.75s">w ≈ 0.594 · f32</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-7.0s">q = 76 · e = −7</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-5.25s">76 → 1 byte</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-3.5s">int8 → cajas</text><text class="mono cv" x="0" y="4.5" text-anchor="middle" style="font-size:12px;animation-delay:-1.75s">{"box": …}</text><animateMotion dur="14.0s" repeatCount="indefinite" calcMode="linear" path="M127.5,210 H832.5 V248 H127.5" keyPoints="0.0000;0.0000;0.1623;0.1623;0.3246;0.3246;0.4869;0.4869;0.5131;0.5131;0.6754;0.6754;0.8377;0.8377;1.0000;1.0000" keyTimes="0.0000;0.0714;0.1250;0.1964;0.2500;0.3214;0.3750;0.4464;0.5000;0.5714;0.6250;0.6964;0.7500;0.8214;0.8750;1.0000"/></g>
<rect class="panel" x="25" y="414" width="910" height="50" rx="8"/>
<text x="40" y="435" class="small">Ejemplo con un peso real de la 1.ª capa (model.0.conv): entrenado como <tspan class="mono f-blue">≈ 0.594</tspan> en float32 (4 bytes),</text>
<text x="40" y="454" class="small">se guarda como <tspan class="mono f-green">q = 76</tspan> en int8 (1 byte) con exponente <tspan class="mono f-purple">e = −7</tspan>, y el ESP32-P4 lo reconstruye como <tspan class="mono">76 × 2⁻⁷ = 0.59375</tspan>.</text>
</svg>
