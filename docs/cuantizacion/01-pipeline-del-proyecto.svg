<circle cx="515" cy="114" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="515" y="118.5" text-anchor="middle" class="small bold">3</text>
<text x="533" y="119" class="bold" style="font-size:15px">Roboflow</text>
<text x="509" y="144" class="small">etiquetas YOLOv8</text>
<text x="509" y="162" class="small muted">obstacle · person</text>
<rect x="509" y="168" width="43.0" height="17" rx="8.5" fill="var(--panel)" stroke="var(--muted)" stroke-width=".8"/>
<text x="530.5" y="180" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--muted)">uint8</text>
<rect class="box" x="730" y="92" width="205" height="100" rx="10"/>
<rect class="hl" x="727" y="89" width="211" height="106" rx="12" style="animation-delay:-8.75s"/>
<circle cx="750" cy="114" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="750" y="118.5" text-anchor="middle" class="small bold">4</text>
<text x="768" y="119" class="bold" style="font-size:15px">Entrenamiento</text>
<text x="744" y="144" class="small">ESPDet-Pico 224×224</text>
<text x="744" y="162" class="small muted">pesos y activaciones</text>
<rect x="744" y="168" width="57.0" height="17" rx="8.5" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width=".8"/>
<text x="772.5" y="180" text-anchor="middle" class="mono" style="font-size:11px;fill:var(--blue)">float32</text>
<rect class="box key" x="730" y="266" width="205" height="100" rx="10"/>
<rect class="hl" x="727" y="263" width="211" height="106" rx="12" style="animation-delay:-7.0s"/>
<circle cx="750" cy="288" r="11" fill="var(--panel)" stroke="var(--border)"/>
