<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
<title id="t">Pipeline del proyecto y punto de cuantización</title>
<desc id="d">Ocho etapas: videos, extracción de fotogramas a 224x224, etiquetado en Roboflow, entrenamiento en float32, cuantización con ESP-PPQ a int8, archivo .espdl de 577 KB, inferencia int8 en el ESP32-P4 y visualización en el PC.</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;
--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--red:#cf222e;--red-bg:#ffebe9;
--orange:#bc4c00;--orange-bg:#fff1e5;--purple:#8250df;--purple-bg:#fbefff;--grid:#d8dee4;--yellow-bg:#fff8c5}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;
--muted:#9198a1;--blue:#4493f8;--blue-bg:#0c2d6b;--green:#3fb950;--green-bg:#0f3a1d;--red:#f85149;
--red-bg:#4b1113;--orange:#db6d28;--orange-bg:#3d1f00;--purple:#ab7df8;--purple-bg:#2e1a52;--grid:#30363d;--yellow-bg:#3b2e00}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.muted{fill:var(--muted)}
.title{font-size:22px;font-weight:600}
.sub{font-size:14px;fill:var(--muted)}
.small{font-size:12px}
.bold{font-weight:600}
.card{fill:var(--bg);stroke:var(--border);stroke-width:1}
.panel{fill:var(--panel);stroke:var(--border);stroke-width:1}
.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-red{fill:var(--red)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}
.s-blue{stroke:var(--blue)}.s-green{stroke:var(--green)}.s-red{stroke:var(--red)}.s-orange{stroke:var(--orange)}.s-purple{stroke:var(--purple)}
.b-blue{fill:var(--blue-bg)}.b-green{fill:var(--green-bg)}.b-red{fill:var(--red-bg)}.b-orange{fill:var(--orange-bg)}.b-purple{fill:var(--purple-bg)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}
.gridline{stroke:var(--grid);stroke-width:1}

.box{fill:var(--bg);stroke:var(--border);stroke-width:1.2}
.key{stroke:var(--purple);stroke-width:2}
.hl{fill:none;stroke:var(--blue);stroke-width:3;opacity:0;animation:hl 14s linear infinite}
@keyframes hl{0%{opacity:0}2%{opacity:1}7%{opacity:1}10%{opacity:0}100%{opacity:0}}
.cv{opacity:0;animation:win 14s steps(1,end) infinite}
@keyframes win{0%{opacity:1}12.5%{opacity:0}100%{opacity:0}}
.chipbox{fill:var(--yellow-bg);stroke:var(--orange);stroke-width:1.2}
.conv{opacity:0;animation:conv 14s linear infinite}
@keyframes conv{0%,50%{opacity:0}52%{opacity:1}62%{opacity:1}64%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.chip{display:none}}
.zone{font-size:13px;font-weight:600;fill:var(--muted);letter-spacing:.04em}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="card" x="0.5" y="0.5" width="959" height="479" rx="12"/>
<text class="title" x="25" y="40">Del video al microcontrolador: ¿dónde entra la cuantización?</text>
<text class="sub" x="25" y="64">Pipeline de este repositorio. El modelo se entrena en float32 en el PC y se cuantiza a int8 una sola vez, antes de flashearlo.</text>
<text class="zone" x="25" y="86">EN EL PC · ENTRENAMIENTO EN FLOAT32</text>
<text class="zone" x="25" y="388">DESPLIEGUE · INFERENCIA EN INT8 EN EL ESP32-P4</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<line class="line" x1="233" y1="142.0" x2="256" y2="142.0" marker-end="url(#ar)"/>
