<rect class="hl" x="492" y="263" width="211" height="106" rx="12" style="animation-delay:-5.25s"/>
<circle cx="515" cy="288" r="11" fill="var(--panel)" stroke="var(--border)"/>
<text x="515" y="292.5" text-anchor="middle" class="small bold">6</text>
<text x="533" y="293" class="bold" style="font-size:15px">.espdl en flash</text>
