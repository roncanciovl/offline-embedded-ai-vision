<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
<title id="t">Cuantizar es redondear a una rejilla</title>
<desc id="d">Siete valores reales caen sobre una rejilla de 8 niveles con paso 0.25; se muestran el error de redondeo y la saturación del valor 0.91.</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;
--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--red:#cf222e;--red-bg:#ffebe9;
--orange:#bc4c00;--orange-bg:#fff1e5;--purple:#8250df;--purple-bg:#fbefff;--grid:#d8dee4;--yellow-bg:#fff8c5}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;
--muted:#9198a1;--blue:#4493f8;--blue-bg:#0c2d6b;--green:#3fb950;--green-bg:#0f3a1d;--red:#f85149;
--red-bg:#4b1113;--orange:#db6d28;--orange-bg:#3d1f00;--purple:#ab7df8;--purple-bg:#2e1a52;--grid:#30363d;--yellow-bg:#3b2e00}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.muted{fill:var(--muted)}
.title{font-size:22px;font-weight:600}
.sub{font-size:14px;fill:var(--muted)}
.small{font-size:12px}
.bold{font-weight:600}
.card{fill:var(--bg);stroke:var(--border);stroke-width:1}
.panel{fill:var(--panel);stroke:var(--border);stroke-width:1}
.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-red{fill:var(--red)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}
.s-blue{stroke:var(--blue)}.s-green{stroke:var(--green)}.s-red{stroke:var(--red)}.s-orange{stroke:var(--orange)}.s-purple{stroke:var(--purple)}
.b-blue{fill:var(--blue-bg)}.b-green{fill:var(--green-bg)}.b-red{fill:var(--red-bg)}.b-orange{fill:var(--orange-bg)}.b-purple{fill:var(--purple-bg)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}
.gridline{stroke:var(--grid);stroke-width:1}

.axis{stroke:var(--fg);stroke-width:1.5}
.dot{fill:var(--blue)}
.ghost{fill:var(--blue);opacity:.35}
.tick{stroke:var(--green);stroke-width:2}
.mv{transform:translate(var(--dx),140px);animation:mv 14s cubic-bezier(.5,0,.3,1) infinite}
@keyframes mv{0%,24%{transform:translate(0,0)}38%,100%{transform:translate(var(--dx),140px)}}
.p1{animation:p1 14s linear infinite}
.p2{animation:p2 14s linear infinite}
.p3{animation:p3 14s linear infinite}
.p4{animation:p4 14s linear infinite}
.dot.sat{fill:var(--orange)}
.err{stroke:var(--red);stroke-width:3;stroke-linecap:round}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
@keyframes p1{0%{opacity:0}1.429%{opacity:0}3.214%{opacity:1}98.214%{opacity:1}100%{opacity:1}}@keyframes p2{0%{opacity:0}12.857%{opacity:0}14.643%{opacity:1}98.214%{opacity:1}100%{opacity:1}}@keyframes p3{0%{opacity:0}40.000%{opacity:0}41.786%{opacity:1}98.214%{opacity:1}100%{opacity:1}}@keyframes p4{0%{opacity:0}52.857%{opacity:0}54.643%{opacity:1}98.214%{opacity:1}100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="card" x="0.5" y="0.5" width="959" height="469" rx="12"/>
<text class="title" x="30" y="42">Cuantizar = redondear cada número a una rejilla de enteros</text>
<text class="sub" x="30" y="66">Un valor real x se guarda como un entero q. Para usarlo se reconstruye x̂ = q · Δ. Lo que se pierde es el error de redondeo x − x̂.</text>
<text x="30" y="155" class="small bold f-blue">float32</text>
<line class="axis" x1="110" y1="150" x2="850" y2="150"/>
<line class="axis" x1="110.0" y1="145" x2="110.0" y2="155"/>
<text x="110.0" y="174" text-anchor="middle" class="small muted mono">-1</text>
<line class="axis" x1="295.0" y1="145" x2="295.0" y2="155"/>
<text x="295.0" y="174" text-anchor="middle" class="small muted mono">-0.5</text>
<line class="axis" x1="480.0" y1="145" x2="480.0" y2="155"/>
<text x="480.0" y="174" text-anchor="middle" class="small muted mono">0</text>
<line class="axis" x1="665.0" y1="145" x2="665.0" y2="155"/>
<text x="665.0" y="174" text-anchor="middle" class="small muted mono">0.5</text>
<line class="axis" x1="850.0" y1="145" x2="850.0" y2="155"/>
<text x="850.0" y="174" text-anchor="middle" class="small muted mono">1</text>
<text x="862" y="155" class="small muted">continuo</text>
<text x="30" y="295" class="small bold f-green">entero q</text>
<line class="axis" x1="110" y1="290" x2="850" y2="290"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--green)"/></marker></defs>
<g class="p2"><line class="tick" x1="110.0" y1="278" x2="110.0" y2="302"/><text x="110.0" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">-4</text><text x="110.0" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">-1.00</text><line class="tick" x1="202.5" y1="278" x2="202.5" y2="302"/><text x="202.5" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">-3</text><text x="202.5" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">-0.75</text><line class="tick" x1="295.0" y1="278" x2="295.0" y2="302"/><text x="295.0" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">-2</text><text x="295.0" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">-0.50</text><line class="tick" x1="387.5" y1="278" x2="387.5" y2="302"/><text x="387.5" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">-1</text><text x="387.5" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">-0.25</text><line class="tick" x1="480.0" y1="278" x2="480.0" y2="302"/><text x="480.0" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">0</text><text x="480.0" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">0.00</text><line class="tick" x1="572.5" y1="278" x2="572.5" y2="302"/><text x="572.5" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">+1</text><text x="572.5" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">+0.25</text><line class="tick" x1="665.0" y1="278" x2="665.0" y2="302"/><text x="665.0" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">+2</text><text x="665.0" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">+0.50</text><line class="tick" x1="757.5" y1="278" x2="757.5" y2="302"/><text x="757.5" y="322" text-anchor="middle" class="mono bold f-green" style="font-size:14px">+3</text><text x="757.5" y="340" text-anchor="middle" class="mono muted" style="font-size:11px">+0.75</text><path d="M480.0,264 H572.5" stroke="var(--green)" stroke-width="1.5" marker-start="url(#a2)" marker-end="url(#a2)"/><text x="526.25" y="258" text-anchor="middle" class="small f-green bold">Δ = 0.25</text><rect x="761.5" y="276" width="88.5" height="28" fill="var(--orange-bg)" opacity=".8"/><text x="805.75" y="270" text-anchor="middle" class="small f-orange bold">satura</text><text x="862" y="295" class="small muted">8 niveles</text></g>
<g class="p1"><circle class="ghost" cx="180.29999999999998" cy="150" r="6"/><text x="180.29999999999998" y="136" text-anchor="middle" class="mono small">-0.81</text><circle class="ghost" cx="306.1" cy="150" r="6"/><text x="306.1" y="136" text-anchor="middle" class="mono small">-0.47</text><circle class="ghost" cx="435.6" cy="150" r="6"/><text x="435.6" y="136" text-anchor="middle" class="mono small">-0.12</text><circle class="ghost" cx="498.5" cy="150" r="6"/><text x="498.5" y="136" text-anchor="middle" class="mono small">0.05</text><circle class="ghost" cx="602.1" cy="150" r="6"/><text x="602.1" y="136" text-anchor="middle" class="mono small">0.33</text><circle class="ghost" cx="694.6" cy="150" r="6"/><text x="694.6" y="136" text-anchor="middle" class="mono small">0.58</text><circle class="ghost" cx="816.7" cy="150" r="6"/><text x="816.7" y="136" text-anchor="middle" class="mono small">0.91</text></g>
<g class="p3"><line class="guide" x1="180.29999999999998" y1="158" x2="180.29999999999998" y2="288"/><line class="err" x1="180.29999999999998" y1="290" x2="202.5" y2="290"/><line class="guide" x1="306.1" y1="158" x2="306.1" y2="288"/><line class="err" x1="306.1" y1="290" x2="295.0" y2="290"/><line class="guide" x1="435.6" y1="158" x2="435.6" y2="288"/><line class="err" x1="435.6" y1="290" x2="480.0" y2="290"/><line class="guide" x1="498.5" y1="158" x2="498.5" y2="288"/><line class="err" x1="498.5" y1="290" x2="480.0" y2="290"/><line class="guide" x1="602.1" y1="158" x2="602.1" y2="288"/><line class="err" x1="602.1" y1="290" x2="572.5" y2="290"/><line class="guide" x1="694.6" y1="158" x2="694.6" y2="288"/><line class="err" x1="694.6" y1="290" x2="665.0" y2="290"/><line class="guide" x1="816.7" y1="158" x2="816.7" y2="288"/><line class="err" x1="816.7" y1="290" x2="757.5" y2="290"/></g>
<g class="p1"><circle class="dot mv" cx="180.29999999999998" cy="150" r="7" style="--dx:22.20px"/><circle class="dot mv" cx="306.1" cy="150" r="7" style="--dx:-11.10px"/><circle class="dot mv" cx="435.6" cy="150" r="7" style="--dx:44.40px"/><circle class="dot mv" cx="498.5" cy="150" r="7" style="--dx:-18.50px"/><circle class="dot mv" cx="602.1" cy="150" r="7" style="--dx:-29.60px"/><circle class="dot mv" cx="694.6" cy="150" r="7" style="--dx:-29.60px"/><circle class="dot mv sat" cx="816.7" cy="150" r="7" style="--dx:-59.20px"/></g>
<g class="p3"><text x="110" y="370" class="small"><tspan class="f-red bold">— error de redondeo</tspan>: como mucho Δ/2 = 0.125.  −0.12 y 0.05 colapsan al mismo entero (0).  <tspan class="f-orange bold">0.91 no cabe</tspan>: se recorta a q = 3 (0.75).</text></g>
<g class="p4"><rect class="panel" x="30" y="372" width="900" height="78" rx="8"/><text x="50" y="402" class="mono" style="font-size:15px">q = clamp( round( x / Δ ), q<tspan dy="4" style="font-size:11px">min</tspan><tspan dy="-4">, q</tspan><tspan dy="4" style="font-size:11px">max</tspan><tspan dy="-4"> )</tspan></text><text x="520" y="402" class="mono" style="font-size:15px">x̂ = q · Δ</text><text x="50" y="430" class="small">Aquí, para que se vea, se usan <tspan class="bold">3 bits (8 niveles)</tspan>. En el modelo del proyecto (int8) hay <tspan class="bold">256 niveles</tspan>, q ∈ [−128, 127], y Δ = 2<tspan dy="-5" style="font-size:9px">e</tspan><tspan dy="5"> es una potencia de 2.</tspan></text></g>
</svg>
