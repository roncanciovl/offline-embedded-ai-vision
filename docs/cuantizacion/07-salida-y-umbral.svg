<text class="title" x="30" y="42">La salida: el umbral de confianza también se cuantiza</text>
<text class="sub" x="30" y="66">La red entrega tensores int8 en 3 escalas. ESP-DL compara enteros y solo pasa a float las celdas que superan el umbral.</text>
