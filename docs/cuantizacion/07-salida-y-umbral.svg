<rect x="40" y="112" width="264" height="264" rx="6" fill="none" stroke="var(--border)"/>
<text x="172.0" y="400" text-anchor="middle" class="small bold w0_30 rm">stride 8 · 28×28 = 784 celdas</text>
<text x="172.0" y="400" text-anchor="middle" class="small bold w30_60 rm">stride 16 · 14×14 = 196 celdas</text>
<text x="172.0" y="400" text-anchor="middle" class="small bold w60_90 rm">stride 32 · 7×7 = 49 celdas</text>
<text x="172.0" y="400" text-anchor="middle" class="small bold w90_160">celdas con q ≥ umbral → cajas → NMS</text>
<text x="172.0" y="420" text-anchor="middle" class="small muted">escena y cajas esquemáticas (ejemplo)</text>
<g class="w3_160"><circle class="num" cx="357" cy="103" r="12"/><text x="357" y="108" text-anchor="middle" class="small bold">1</text><text x="379" y="108" class="step">3 cabezas int8: score0/box0 (28×28), score1/box1 (14×14), score2/box2 (7×7)</text><text x="379" y="128" class="small muted">exponentes reales: score −3, −2, −2 · box −4, −4, −5</text></g>
<g class="w20_160"><circle class="num" cx="357" cy="163" r="12"/><text x="357" y="168" text-anchor="middle" class="small bold">2</text><text x="379" y="168" class="step">1 029 celdas × 2 clases (obstacle, person) = 2 058 scores por imagen</text><text x="379" y="188" class="small muted">cada score es un logit en int8: valor real = q · 2^e</text></g>
<g class="w40_160"><circle class="num" cx="357" cy="223" r="12"/><text x="357" y="228" text-anchor="middle" class="small bold">3</text><text x="379" y="228" class="step">El umbral 0.25 se lleva al dominio int8 una sola vez:</text><text x="379" y="248" class="small muted mono">logit = ln(0.25 / 0.75) = −1.0986   ·   × 2³ = −8.79 → −9   ·   × 2² = −4.39 → −4</text></g>
<g class="w65_160"><circle class="num" cx="357" cy="283" r="12"/><text x="357" y="288" text-anchor="middle" class="small bold">4</text><text x="379" y="288" class="step">Filtro entero: q ≥ −9 (stride 8) o q ≥ −4 (stride 16 y 32)</text><text x="379" y="308" class="small muted">2 058 comparaciones de enteros, ninguna en float</text></g>
<g class="w96_160"><circle class="num" cx="357" cy="343" r="12"/><text x="357" y="348" text-anchor="middle" class="small bold">5</text><text x="379" y="348" class="step">Solo las celdas que pasan se decuantizan:</text><text x="379" y="368" class="small muted mono">score = sigmoid(q · 2^e)  ·  caja = centro ± d · stride,  d = q · 2^e</text></g>
<g class="w112_160"><circle class="num" cx="357" cy="403" r="12"/><text x="357" y="408" text-anchor="middle" class="small bold">6</text><text x="379" y="408" class="step">NMS (IoU > 0.7 se descarta, máx. 10 cajas) y se deshace el letterbox</text><text x="379" y="428" class="small muted">las coordenadas vuelven al tamaño de la imagen original</text></g>
<g class="w132_160"><circle class="num" cx="357" cy="463" r="12"/><text x="357" y="468" text-anchor="middle" class="small bold">7</text><text x="379" y="468" class="step">Se imprime el JSON por USB serie → pc_viewer.py dibuja las cajas</text><text x="379" y="488" class="small muted mono">{"category": 1, "score": 0.83, "box": [x1, y1, x2, y2]}</text></g>
<text x="30" y="514" class="small muted">Los valores de score de las cajas son ilustrativos. Exponentes, número de celdas, umbral (0.25), NMS (0.7) y máx. 10 cajas son los del código del proyecto.</text>
</svg>
