29.6" y="226.1" width="16.9" height="16.9"/><rect class="cand" x="210.7" y="245.0" width="16.9" height="16.9"/><rect class="cand" x="78.7" y="263.9" width="16.9" height="16.9"/><rect class="cand" x="97.6" y="282.7" width="16.9" height="16.9"/><rect class="cand" x="116.4" y="282.7" width="16.9" height="16.9"/><rect class="cand" x="97.6" y="301.6" width="16.9" height="16.9"/></g><g class="w112_134 rm"><rect class="cbox" x="201" y="164" width="46" height="150"/><rect class="cbox" x="205" y="170" width="46" height="140"/><rect class="cbox" x="199" y="166" width="46" height="152"/><rect class="cbox" x="66" y="256" width="78" height="69"/><rect class="cbox" x="72" y="260" width="76" height="68"/></g></g>
