<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">Escala en potencia de dos</title>
<desc id="d">Panel A: un píxel de valor 200 se normaliza y se cuantiza a int8 100 con exponente -7. Panel B: el acumulador 13191 de la primera convolución se desplaza 9 bits a la derecha y se redondea a 26.</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;
--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--red:#cf222e;--red-bg:#ffebe9;
--orange:#bc4c00;--orange-bg:#fff1e5;--purple:#8250df;--purple-bg:#fbefff;--grid:#d8dee4;--yellow-bg:#fff8c5}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;
--muted:#9198a1;--blue:#4493f8;--blue-bg:#0c2d6b;--green:#3fb950;--green-bg:#0f3a1d;--red:#f85149;
--red-bg:#4b1113;--orange:#db6d28;--orange-bg:#3d1f00;--purple:#ab7df8;--purple-bg:#2e1a52;--grid:#30363d;--yellow-bg:#3b2e00}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.muted{fill:var(--muted)}
.title{font-size:22px;font-weight:600}
.sub{font-size:14px;fill:var(--muted)}
.small{font-size:12px}
.bold{font-weight:600}
.card{fill:var(--bg);stroke:var(--border);stroke-width:1}
.panel{fill:var(--panel);stroke:var(--border);stroke-width:1}
.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-red{fill:var(--red)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}
.s-blue{stroke:var(--blue)}.s-green{stroke:var(--green)}.s-red{stroke:var(--red)}.s-orange{stroke:var(--orange)}.s-purple{stroke:var(--purple)}
.b-blue{fill:var(--blue-bg)}.b-green{fill:var(--green-bg)}.b-red{fill:var(--red-bg)}.b-orange{fill:var(--orange-bg)}.b-purple{fill:var(--purple-bg)}
.line{stroke:var(--muted);stroke-width:1.5;fill:none}
.gridline{stroke:var(--grid);stroke-width:1}

.step{fill:var(--bg);stroke:var(--border);stroke-width:1.2}
.bit{fill:var(--bg);stroke:var(--border)}
.bit1{fill:var(--blue-bg);stroke:var(--blue)}
.reg{fill:none;stroke:var(--fg);stroke-width:2}
.shift{animation:shift 16s cubic-bezier(.6,0,.3,1) infinite;transform:translateX(270px)}
@keyframes shift{0%,50%{transform:translateX(0)}60%,100%{transform:translateX(270px)}}
.drop{animation:drop 16s linear infinite;opacity:.3}
@keyframes drop{0%,58%{opacity:1}64%,100%{opacity:.3}}
.ring{fill:none;stroke:var(--orange);stroke-width:3}
.arrow{stroke:var(--muted);stroke-width:1.5;fill:none}
@keyframes a1{0%{opacity:0}2.500%{opacity:0}4.062%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.a1{animation:a1 16s linear infinite}@keyframes a2{0%{opacity:0}8.750%{opacity:0}10.312%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.a2{animation:a2 16s linear infinite}@keyframes a3{0%{opacity:0}15.000%{opacity:0}16.562%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.a3{animation:a3 16s linear infinite}@keyframes a4{0%{opacity:0}21.250%{opacity:0}22.812%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.a4{animation:a4 16s linear infinite}@keyframes a5{0%{opacity:0}27.500%{opacity:0}29.063%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.a5{animation:a5 16s linear infinite}@keyframes a6{0%{opacity:0}33.750%{opacity:0}35.312%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.a6{animation:a6 16s linear infinite}@keyframes b1{0%{opacity:0}40.000%{opacity:0}41.562%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.b1{animation:b1 16s linear infinite}@keyframes b2{0%{opacity:0}61.250%{opacity:0}62.813%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.b2{animation:b2 16s linear infinite}@keyframes b3{0%{opacity:0}68.750%{opacity:0}70.312%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.b3{animation:b3 16s linear infinite}@keyframes b4{0%{opacity:0}76.250%{opacity:0}77.812%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.b4{animation:b4 16s linear infinite}@keyframes bz{0%{opacity:0}60.000%{opacity:0}61.562%{opacity:1}98.438%{opacity:1}100%{opacity:1}}.bz{animation:bz 16s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="card" x="0.5" y="0.5" width="959" height="559" rx="12"/>
<text class="title" x="30" y="42">Escala = potencia de 2: multiplicar se vuelve desplazar bits</text>
<text class="sub" x="30" y="66">ESP-DL usa cuantización simétrica con Δ = 2^e. Cada tensor del modelo guarda su exponente e (valores reales leídos del .espdl).</text>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
<rect class="panel" x="20" y="92" width="920" height="170" rx="10"/>
<text x="38" y="120" class="bold">A · La entrada de la red: un píxel → int8 (tensor <tspan class="mono">images</tspan>, e = −7)</text>
<g class="a1"><rect class="step" x="38" y="138" width="160" height="78" rx="8"/><text x="118.0" y="160" text-anchor="middle" class="small muted">píxel R</text><text x="118.0" y="188" text-anchor="middle" class="mono bold f-muted" style="font-size:20px">200</text><text x="118.0" y="207" text-anchor="middle" class="small muted">uint8 (JPEG)</text></g>
<g class="a2"><rect class="step" x="219" y="138" width="160" height="78" rx="8"/><text x="299.0" y="160" text-anchor="middle" class="small muted">÷ 255</text><text x="299.0" y="188" text-anchor="middle" class="mono bold f-blue" style="font-size:20px">0.7843</text><text x="299.0" y="207" text-anchor="middle" class="small muted">preproceso</text><line class="arrow" x1="200" y1="177" x2="216" y2="177" marker-end="url(#a3)"/></g>
<g class="a3"><rect class="step" x="400" y="138" width="160" height="78" rx="8"/><text x="480.0" y="160" text-anchor="middle" class="small muted">÷ 2⁻⁷  (× 128)</text><text x="480.0" y="188" text-anchor="middle" class="mono bold f-blue" style="font-size:20px">100.39</text><text x="480.0" y="207" text-anchor="middle" class="small muted">float</text><line class="arrow" x1="381" y1="177" x2="397" y2="177" marker-end="url(#a3)"/></g>
<g class="a4"><rect class="step" x="581" y="138" width="160" height="78" rx="8"/><text x="661.0" y="160" text-anchor="middle" class="small muted">round</text><text x="661.0" y="188" text-anchor="middle" class="mono bold f-green" style="font-size:20px">100</text><text x="661.0" y="207" text-anchor="middle" class="small muted">entero</text><line class="arrow" x1="562" y1="177" x2="578" y2="177" marker-end="url(#a3)"/></g>
<g class="a5"><rect class="step" x="762" y="138" width="160" height="78" rx="8"/><text x="842.0" y="160" text-anchor="middle" class="small muted">int8</text><text x="842.0" y="188" text-anchor="middle" class="mono bold f-green" style="font-size:20px">01100100</text><text x="842.0" y="207" text-anchor="middle" class="small muted">1 byte</text><line class="arrow" x1="743" y1="177" x2="759" y2="177" marker-end="url(#a3)"/></g>
<g class="a6"><text x="38" y="248" class="small">Para usarlo: <tspan class="mono">x̂ = 100 × 2⁻⁷ = 0.78125</tspan>  (error 0.003). El blanco puro (255 → 1.0 → 128) se recorta a 127 = 0.992: el rango int8 es [−128, 127].</text></g>
<rect class="panel" x="20" y="282" width="920" height="258" rx="10"/>
<text x="38" y="310" class="bold">B · Entre capas: el acumulador int32 pasa a int8 con un solo desplazamiento</text>
<text x="38" y="332" class="small muted">Capa 0, canal 0: acumulador = 13191 con exponente −7 + (−7) = −14. La salida usa e = −5, así que se desplaza −5 − (−14) = 9 bits a la derecha.</text>
<g class="b1">
<text x="110" y="395" text-anchor="end" class="mono small">13191 =</text>
<g class="bz"><rect class="bit" x="120" y="374" width="30" height="30"/><text x="135.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="150" y="374" width="30" height="30"/><text x="165.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="180" y="374" width="30" height="30"/><text x="195.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="210" y="374" width="30" height="30"/><text x="225.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="240" y="374" width="30" height="30"/><text x="255.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="270" y="374" width="30" height="30"/><text x="285.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="300" y="374" width="30" height="30"/><text x="315.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="330" y="374" width="30" height="30"/><text x="345.0" y="394" text-anchor="middle" class="mono muted">0</text><rect class="bit" x="360" y="374" width="30" height="30"/><text x="375.0" y="394" text-anchor="middle" class="mono muted">0</text></g>
<g class="shift"><rect class="bit" x="120" y="374" width="30" height="30"/><text x="135.0" y="394" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="150" y="374" width="30" height="30"/><text x="165.0" y="394" text-anchor="middle" class="mono bold">0</text><rect class="bit1" x="180" y="374" width="30" height="30"/><text x="195.0" y="394" text-anchor="middle" class="mono bold">1</text><rect class="bit1" x="210" y="374" width="30" height="30"/><text x="225.0" y="394" text-anchor="middle" class="mono bold">1</text><rect class="bit" x="240" y="374" width="30" height="30"/><text x="255.0" y="394" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="270" y="374" width="30" height="30"/><text x="285.0" y="394" text-anchor="middle" class="mono bold">0</text><rect class="bit1" x="300" y="374" width="30" height="30"/><text x="315.0" y="394" text-anchor="middle" class="mono bold">1</text><g class="drop"><rect class="bit1" x="330" y="374" width="30" height="30"/><text x="345.0" y="394" text-anchor="middle" class="mono bold">1</text></g><g class="drop"><rect class="bit1" x="360" y="374" width="30" height="30"/><text x="375.0" y="394" text-anchor="middle" class="mono bold">1</text></g><g class="drop"><rect class="bit" x="390" y="374" width="30" height="30"/><text x="405.0" y="394" text-anchor="middle" class="mono bold">0</text></g><g class="drop"><rect class="bit" x="420" y="374" width="30" height="30"/><text x="435.0" y="394" text-anchor="middle" class="mono bold">0</text></g><g class="drop"><rect class="bit" x="450" y="374" width="30" height="30"/><text x="465.0" y="394" text-anchor="middle" class="mono bold">0</text></g><g class="drop"><rect class="bit" x="480" y="374" width="30" height="30"/><text x="495.0" y="394" text-anchor="middle" class="mono bold">0</text></g><g class="drop"><rect class="bit1" x="510" y="374" width="30" height="30"/><text x="525.0" y="394" text-anchor="middle" class="mono bold">1</text></g><g class="drop"><rect class="bit1" x="540" y="374" width="30" height="30"/><text x="555.0" y="394" text-anchor="middle" class="mono bold">1</text></g><g class="drop"><rect class="bit1" x="570" y="374" width="30" height="30"/><text x="585.0" y="394" text-anchor="middle" class="mono bold">1</text></g></g>
<rect class="reg" x="120" y="374" width="480" height="30"/>
<text x="360" y="364" text-anchor="middle" class="small muted">registro de 16 bits (se muestran los 16 bits bajos del int32)</text>
</g>
<g class="b2"><rect class="ring" x="601" y="371" width="28" height="36" rx="4"/><text x="735.0" y="426" text-anchor="middle" class="small f-orange">9 bits descartados; el primero vale ½ → redondear hacia arriba</text></g>
<g class="b3"><text x="110" y="477" text-anchor="end" class="mono small">resultado =</text><rect class="bit" x="120" y="456" width="30" height="30" style=""/><text x="135.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="150" y="456" width="30" height="30" style=""/><text x="165.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="180" y="456" width="30" height="30" style=""/><text x="195.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="210" y="456" width="30" height="30" style=""/><text x="225.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="240" y="456" width="30" height="30" style=""/><text x="255.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="270" y="456" width="30" height="30" style=""/><text x="285.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="300" y="456" width="30" height="30" style=""/><text x="315.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="330" y="456" width="30" height="30" style=""/><text x="345.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="360" y="456" width="30" height="30" style=""/><text x="375.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="390" y="456" width="30" height="30" style=""/><text x="405.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit" x="420" y="456" width="30" height="30" style=""/><text x="435.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit1" x="450" y="456" width="30" height="30" style="fill:var(--green-bg);stroke:var(--green)"/><text x="465.0" y="476" text-anchor="middle" class="mono bold">1</text><rect class="bit1" x="480" y="456" width="30" height="30" style="fill:var(--green-bg);stroke:var(--green)"/><text x="495.0" y="476" text-anchor="middle" class="mono bold">1</text><rect class="bit" x="510" y="456" width="30" height="30" style=""/><text x="525.0" y="476" text-anchor="middle" class="mono bold">0</text><rect class="bit1" x="540" y="456" width="30" height="30" style="fill:var(--green-bg);stroke:var(--green)"/><text x="555.0" y="476" text-anchor="middle" class="mono bold">1</text><rect class="bit" x="570" y="456" width="30" height="30" style=""/><text x="585.0" y="476" text-anchor="middle" class="mono bold">0</text><text x="614" y="477" class="mono bold f-green">= 25 + 1 = 26   (int8, e = −5)</text></g>
<g class="b4"><text x="38" y="524" class="small">Comprobación: <tspan class="mono">13191 × 2⁻¹⁴ = 0.8051</tspan>  →  <tspan class="mono">26 × 2⁻⁵ = 0.8125</tspan>. Con escalas arbitrarias habría que multiplicar por un factor real; con 2^e basta <tspan class="mono bold">&gt;&gt; 9</tspan>.</text></g>
</svg>
